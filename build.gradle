plugins {
    id 'java'
}

group = 'com.cajanegra2'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    karateVersion = '1.4.1'
}

dependencies {
    testImplementation "com.intuit.karate:karate-junit5:${karateVersion}"
    testImplementation "ch.qos.logback:logback-classic:1.5.6"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Mantiene soporte para pasar propiedades del sistema desde CLI
    systemProperty "karate.options", System.getProperty("karate.options")
    // Muestra la salida de Karate en consola
    testLogging {
        showStandardStreams = true
    }
    // Siempre ejecuta las pruebas (el API es externo, el resultado puede cambiar)
    outputs.upToDateWhen { false }
}

clean {
    delete 'target'
}
